receivers:
  file_log/nginx_access:
    include:
      - ./access.log
    start_at: end
    operators:
      - type: regex_parser
        on_error: drop
        regex: '^(?P<client_address>\S+) - - \[(?P<nginx_time_local>[^\]]+)\] "(?P<http_request_method>[A-Z]+) (?P<url_path_raw>\S+) (?P<network_protocol_version>[^"]+)" (?P<http_response_status_code_raw>\d{3}) (?P<http_response_body_size>\S+) "(?P<http_request_referrer>[^"]*)" "(?P<user_agent_original>[^"]*)"$'
        timestamp:
          parse_from: attributes.nginx_time_local
          layout: '%d/%b/%Y:%H:%M:%S %z'

processors:
  transform/nginx_access:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(attributes["client.address"], attributes["client_address"])
          - set(attributes["http.request.method"], attributes["http_request_method"])
          - set(attributes["network.protocol.version"], attributes["network_protocol_version"])
          - set(attributes["http.response.body.size"], attributes["http_response_body_size"])
          - set(attributes["http.request.referrer"], attributes["http_request_referrer"])
          - set(attributes["user_agent.original"], attributes["user_agent_original"])
          - set(attributes["url.path"], attributes["url_path_raw"])
          - replace_pattern(attributes["url.path"], "\\?.*$", "")
          - replace_pattern(attributes["url.path"], "/+$", "") where attributes["url.path"] != "/"
          - set(attributes["http.response.status_code"], Int(attributes["http_response_status_code_raw"]))
          - set(severity_text, "INFO")
          - set(severity_number, 9)
          - set(severity_text, "ERROR") where attributes["http.response.status_code"] >= 500
          - set(severity_number, 17) where attributes["http.response.status_code"] >= 500
          - delete_key(attributes, "client_address")
          - delete_key(attributes, "nginx_time_local")
          - delete_key(attributes, "http_request_method")
          - delete_key(attributes, "url_path_raw")
          - delete_key(attributes, "network_protocol_version")
          - delete_key(attributes, "http_response_status_code_raw")
          - delete_key(attributes, "http_response_body_size")
          - delete_key(attributes, "http_request_referrer")
          - delete_key(attributes, "user_agent_original")
          - truncate_all(attributes, 256)
  resource/service:
    attributes:
      - key: service.name
        value: nginx-log
        action: insert

exporters:
  debug/logs:
  debug/metrics:
  mackerel_otlp:

service:
  pipelines:
    logs:
      receivers:
        [file_log/nginx_access]
      processors:
        [transform/nginx_access, resource/service]
      exporters:
        [debug/logs, mackerel_otlp]
